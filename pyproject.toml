[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "irma-magic"
version = "0.1.0"
description = "Utilities for CDC-IRMA execution and bioinformatics result processing"
requires-python = ">=3.8"

[project.scripts]
irmagic = "irma_magic.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
